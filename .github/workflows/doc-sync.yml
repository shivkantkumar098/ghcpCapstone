name: Documentation sync

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  doc-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check generated documentation
        if: ${{ hashFiles('scripts/doc_sync.py', 'scripts/doc_sync/__main__.py') != '' }}
        run: python -m scripts.doc_sync --check

      - name: Skip documentation check when no generator exists
        if: ${{ hashFiles('scripts/doc_sync.py', 'scripts/doc_sync/__main__.py') == '' }}
        run: echo "No documentation sync module exists; documentation checks are not applicable."
